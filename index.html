<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Playground</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a192f 0%, #0f2847 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #64ffda;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(100, 255, 218, 0.5);
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 1em;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 350px 1fr 350px;
            gap: 20px;
            margin-bottom: 30px;
        }

        .panel {
            background: rgba(15, 40, 71, 0.8);
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .panel h2 {
            color: #64ffda;
            font-size: 1.2em;
            margin-bottom: 15px;
            border-bottom: 2px solid #64ffda;
            padding-bottom: 10px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #b0b0b0;
            font-size: 0.9em;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(100, 255, 218, 0.1);
            outline: none;
            -webkit-appearance: none;
            accent-color: #64ffda;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #64ffda;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(100, 255, 218, 0.5);
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #64ffda;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(100, 255, 218, 0.5);
            border: none;
        }

        .slider-value {
            display: inline-block;
            background: rgba(100, 255, 218, 0.1);
            color: #64ffda;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            margin-top: 5px;
        }

        select {
            width: 100%;
            padding: 10px;
            background: rgba(100, 255, 218, 0.05);
            border: 1px solid rgba(100, 255, 218, 0.3);
            color: #e0e0e0;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }

        select option {
            background: #0a192f;
            color: #e0e0e0;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: 2px solid #64ffda;
            border-radius: 5px;
            background: rgba(100, 255, 218, 0.1);
            color: #64ffda;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        button:hover {
            background: rgba(100, 255, 218, 0.2);
            box-shadow: 0 0 15px rgba(100, 255, 218, 0.4);
            transform: translateY(-2px);
        }

        button.active {
            background: #64ffda;
            color: #0a192f;
            box-shadow: 0 0 20px rgba(100, 255, 218, 0.6);
        }

        button.danger {
            border-color: #ff6b6b;
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }

        button.danger:hover {
            background: rgba(255, 107, 107, 0.2);
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.4);
        }

        .center-panel {
            grid-column: 2;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .visualization-container {
            background: rgba(15, 40, 71, 0.8);
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 10px;
            padding: 20px;
            flex: 1;
        }

        canvas {
            width: 100%;
            height: 400px;
            border-radius: 5px;
            background: rgba(10, 25, 47, 0.5);
        }

        #decisionBoundary {
            display: block;
            margin-bottom: 15px;
        }

        #lossChart {
            display: block;
            margin: 0;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .metric {
            background: rgba(100, 255, 218, 0.05);
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 5px;
            padding: 15px;
            text-align: center;
        }

        .metric-value {
            font-size: 1.5em;
            color: #64ffda;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .metric-label {
            font-size: 0.85em;
            color: #a0a0a0;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .network-canvas {
            width: 100%;
            height: 500px;
            border-radius: 5px;
            background: rgba(10, 25, 47, 0.5);
        }

        .layer-controls {
            display: grid;
            gap: 10px;
        }

        .layer-item {
            background: rgba(100, 255, 218, 0.05);
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 5px;
            padding: 12px;
        }

        .layer-header {
            color: #64ffda;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .layer-controls-inner {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        select.activation {
            flex: 1;
            padding: 6px;
            font-size: 0.85em;
        }

        button.remove-layer {
            padding: 6px 10px;
            font-size: 0.8em;
            border-color: #ff6b6b;
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }

        .neurons-display {
            color: #a0a0a0;
            font-size: 0.85em;
            margin-top: 5px;
        }

        .training-status {
            background: rgba(100, 255, 218, 0.05);
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 5px;
            padding: 12px;
            text-align: center;
            margin-top: auto;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        .status-indicator.idle {
            background: #a0a0a0;
            animation: none;
        }

        .status-indicator.training {
            background: #64ffda;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text {
            color: #b0b0b0;
            font-size: 0.9em;
        }

        @media (max-width: 1400px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .metrics-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .add-layer-btn {
            width: 100%;
            margin-top: 10px;
        }

        .dataset-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button.dataset-btn {
            padding: 10px;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ Neural Network Playground</h1>
            <p class="subtitle">Interactive Deep Learning Visualization</p>
        </header>

        <div class="main-grid">
            <!-- Left Panel: Controls -->
            <div class="panel">
                <h2>Configuration</h2>

                <div class="control-group">
                    <label>Dataset</label>
                    <div class="dataset-buttons">
                        <button class="dataset-btn" data-dataset="xor">XOR</button>
                        <button class="dataset-btn" data-dataset="circle">Circle</button>
                        <button class="dataset-btn active" data-dataset="spiral">Spiral</button>
                        <button class="dataset-btn" data-dataset="gaussian">Gaussian</button>
                        <button class="dataset-btn" data-dataset="moons">Moons</button>
                        <button class="dataset-btn" data-dataset="sine">Sine</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>Learning Rate: <span id="lrValue">0.1</span></label>
                    <input type="range" id="learningRate" min="0.001" max="1" step="0.001" value="0.1">
                </div>

                <div class="control-group">
                    <label>Batch Size: <span id="bsValue">32</span></label>
                    <input type="range" id="batchSize" min="1" max="128" step="1" value="32">
                </div>

                <div class="control-group">
                    <label>Epochs: <span id="epochsValue">100</span></label>
                    <input type="range" id="epochs" min="1" max="500" step="1" value="100">
                </div>

                <div class="control-group">
                    <label>Regularization: <span id="regValue">0</span></label>
                    <input type="range" id="regularization" min="0" max="0.1" step="0.001" value="0">
                </div>

                <div class="control-group">
                    <label>Reg Type</label>
                    <select id="regType">
                        <option value="none">None</option>
                        <option value="l1">L1</option>
                        <option value="l2">L2</option>
                    </select>
                </div>

                <div class="button-group">
                    <button id="trainBtn">Train</button>
                    <button id="pauseBtn">Pause</button>
                    <button id="resetBtn" class="danger">Reset</button>
                </div>

                <div class="training-status">
                    <div>
                        <span class="status-indicator idle" id="statusIndicator"></span>
                        <span class="status-text" id="statusText">Ready</span>
                    </div>
                </div>
            </div>

            <!-- Center Panel: Visualizations -->
            <div class="center-panel">
                <div class="visualization-container">
                    <h2 style="margin-bottom: 15px; margin-top: 0;">Decision Boundary</h2>
                    <canvas id="decisionBoundary"></canvas>
                </div>

                <div class="visualization-container">
                    <h2 style="margin-bottom: 15px; margin-top: 0;">Training Progress</h2>
                    <canvas id="lossChart"></canvas>
                </div>

                <div class="metrics-grid">
                    <div class="metric">
                        <div class="metric-value" id="accuracyValue">0.00%</div>
                        <div class="metric-label">Accuracy</div>
                    </div>
                    <div class="metric">
                        <div class="metric-value" id="lossValue">0.00</div>
                        <div class="metric-label">Loss</div>
                    </div>
                    <div class="metric">
                        <div class="metric-value" id="epochValue">0</div>
                        <div class="metric-label">Epoch</div>
                    </div>
                    <div class="metric">
                        <div class="metric-value" id="timeValue">0s</div>
                        <div class="metric-label">Time</div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Network Architecture -->
            <div class="right-panel">
                <div class="panel">
                    <h2>Network Architecture</h2>

                    <div class="layer-controls">
                        <div class="layer-item">
                            <div class="layer-header">Input Layer</div>
                            <div class="neurons-display">2 neurons</div>
                        </div>

                        <div id="hiddenLayers"></div>

                        <div class="layer-item">
                            <div class="layer-header">Output Layer</div>
                            <div class="neurons-display">2 neurons (softmax)</div>
                        </div>

                        <button class="add-layer-btn" id="addLayerBtn">+ Add Hidden Layer</button>
                    </div>
                </div>

                <div class="panel" style="flex: 1; display: flex; flex-direction: column;">
                    <h2>Network Diagram</h2>
                    <canvas id="networkDiagram" class="network-canvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== Neural Network Implementation ====================

        class Matrix {
            constructor(rows, cols) {
                this.rows = rows;
                this.cols = cols;
                this.data = Array(rows).fill(null).map(() => Array(cols).fill(0));
            }

            randomize() {
                for (let i = 0; i < this.rows; i++) {
                    for (let j = 0; j < this.cols; j++) {
                        this.data[i][j] = Math.random() * 2 - 1;
                    }
                }
            }

            multiply(other) {
                if (this.cols !== other.rows) throw new Error('Incompatible dimensions');
                const result = new Matrix(this.rows, other.cols);
                for (let i = 0; i < this.rows; i++) {
                    for (let j = 0; j < other.cols; j++) {
                        let sum = 0;
                        for (let k = 0; k < this.cols; k++) {
                            sum += this.data[i][k] * other.data[k][j];
                        }
                        result.data[i][j] = sum;
                    }
                }
                return result;
            }

            add(other) {
                if (this.rows !== other.rows || this.cols !== other.cols) {
                    throw new Error('Incompatible dimensions');
                }
                const result = new Matrix(this.rows, this.cols);
                for (let i = 0; i < this.rows; i++) {
                    for (let j = 0; j < this.cols; j++) {
                        result.data[i][j] = this.data[i][j] + other.data[i][j];
                    }
                }
                return result;
            }

            subtract(other) {
                const result = new Matrix(this.rows, this.cols);
                for (let i = 0; i < this.rows; i++) {
                    for (let j = 0; j < this.cols; j++) {
                        result.data[i][j] = this.data[i][j] - other.data[i][j];
                    }
                }
                return result;
            }

            scale(scalar) {
                const result = new Matrix(this.rows, this.cols);
                for (let i = 0; i < this.rows; i++) {
                    for (let j = 0; j < this.cols; j++) {
                        result.data[i][j] = this.data[i][j] * scalar;
                    }
                }
                return result;
            }

            transpose() {
                const result = new Matrix(this.cols, this.rows);
                for (let i = 0; i < this.rows; i++) {
                    for (let j = 0; j < this.cols; j++) {
                        result.data[j][i] = this.data[i][j];
                    }
                }
                return result;
            }

            apply(fn) {
                const result = new Matrix(this.rows, this.cols);
                for (let i = 0; i < this.rows; i++) {
                    for (let j = 0; j < this.cols; j++) {
                        result.data[i][j] = fn(this.data[i][j]);
                    }
                }
                return result;
            }

            copy() {
                const result = new Matrix(this.rows, this.cols);
                for (let i = 0; i < this.rows; i++) {
                    for (let j = 0; j < this.cols; j++) {
                        result.data[i][j] = this.data[i][j];
                    }
                }
                return result;
            }
        }

        class Activation {
            static relu(x) { return Math.max(0, x); }
            static reluDerivative(x) { return x > 0 ? 1 : 0; }

            static sigmoid(x) { return 1 / (1 + Math.exp(-x)); }
            static sigmoidDerivative(x) { return x * (1 - x); }

            static tanh(x) { return Math.tanh(x); }
            static tanhDerivative(x) { return 1 - x * x; }

            static softmax(vec) {
                const exps = vec.map(v => Math.exp(Math.min(v, 100)));
                const sum = exps.reduce((a, b) => a + b);
                return exps.map(v => v / sum);
            }

            static softmaxDerivative(x) { return x * (1 - x); }

            static linear(x) { return x; }
            static linearDerivative(x) { return 1; }
        }

        class NeuralNetwork {
            constructor(inputSize, hiddenLayersConfig) {
                this.layers = [];
                this.activations = [];
                this.activationNames = [];
                this.weights = [];
                this.biases = [];
                this.z_values = [];
                this.a_values = [];

                let prevSize = inputSize;

                // Add hidden layers
                for (let config of hiddenLayersConfig) {
                    const weight = new Matrix(prevSize, config.neurons);
                    weight.randomize();
                    this.weights.push(weight);

                    const bias = new Matrix(1, config.neurons);
                    this.biases.push(bias);

                    this.layers.push(config.neurons);
                    this.activationNames.push(config.activation);
                    prevSize = config.neurons;
                }

                // Add output layer
                const outputWeight = new Matrix(prevSize, 2);
                outputWeight.randomize();
                this.weights.push(outputWeight);

                const outputBias = new Matrix(1, 2);
                this.biases.push(outputBias);

                this.layers.push(2);
                this.activationNames.push('softmax');

                this.learningRate = 0.1;
                this.regularization = 0;
                this.regType = 'none';
            }

            forward(input) {
                this.a_values = [input];
                this.z_values = [];

                let current = input;

                for (let i = 0; i < this.weights.length; i++) {
                    const z = current.multiply(this.weights[i]).add(this.biases[i]);
                    this.z_values.push(z);

                    const activation = this.activationNames[i];
                    let a;

                    if (activation === 'relu') {
                        a = z.apply(x => Activation.relu(x));
                    } else if (activation === 'sigmoid') {
                        a = z.apply(x => Activation.sigmoid(x));
                    } else if (activation === 'tanh') {
                        a = z.apply(x => Activation.tanh(x));
                    } else if (activation === 'softmax') {
                        a = new Matrix(z.rows, z.cols);
                        for (let j = 0; j < z.rows; j++) {
                            const softmax = Activation.softmax(z.data[j]);
                            a.data[j] = softmax;
                        }
                    } else {
                        a = z.apply(x => Activation.linear(x));
                    }

                    this.a_values.push(a);
                    current = a;
                }

                return current;
            }

            backward(input, output, batchY) {
                const m = input.rows;
                const deltas = [];

                // Output layer error
                const predictions = output;
                let delta = new Matrix(m, 2);
                for (let i = 0; i < m; i++) {
                    delta.data[i][0] = predictions.data[i][0] - batchY.data[i][0];
                    delta.data[i][1] = predictions.data[i][1] - batchY.data[i][1];
                }
                deltas.push(delta);

                // Backpropagate through hidden layers
                for (let i = this.weights.length - 2; i >= 0; i--) {
                    const prevDelta = deltas[deltas.length - 1];
                    const weightT = this.weights[i + 1].transpose();
                    delta = prevDelta.multiply(weightT);

                    const activation = this.activationNames[i];
                    const a = this.a_values[i + 1];

                    if (activation === 'relu') {
                        for (let j = 0; j < delta.rows; j++) {
                            for (let k = 0; k < delta.cols; k++) {
                                delta.data[j][k] *= this.a_values[i + 1].data[j][k] > 0 ? 1 : 0;
                            }
                        }
                    } else if (activation === 'sigmoid') {
                        for (let j = 0; j < delta.rows; j++) {
                            for (let k = 0; k < delta.cols; k++) {
                                delta.data[j][k] *= a.data[j][k] * (1 - a.data[j][k]);
                            }
                        }
                    } else if (activation === 'tanh') {
                        for (let j = 0; j < delta.rows; j++) {
                            for (let k = 0; k < delta.cols; k++) {
                                delta.data[j][k] *= 1 - a.data[j][k] * a.data[j][k];
                            }
                        }
                    }

                    deltas.unshift(delta);
                }

                // Update weights and biases
                for (let i = 0; i < this.weights.length; i++) {
                    const aT = this.a_values[i].transpose();
                    const dW = aT.multiply(deltas[i]).scale(this.learningRate / m);

                    // Add regularization
                    if (this.regType === 'l2') {
                        const regTerm = this.weights[i].scale(this.regularization / m);
                        this.weights[i] = this.weights[i].subtract(dW).subtract(regTerm);
                    } else if (this.regType === 'l1') {
                        const regTerm = new Matrix(this.weights[i].rows, this.weights[i].cols);
                        for (let j = 0; j < regTerm.rows; j++) {
                            for (let k = 0; k < regTerm.cols; k++) {
                                regTerm.data[j][k] = this.regularization / m * Math.sign(this.weights[i].data[j][k]);
                            }
                        }
                        this.weights[i] = this.weights[i].subtract(dW).subtract(regTerm);
                    } else {
                        this.weights[i] = this.weights[i].subtract(dW);
                    }

                    const dB = new Matrix(1, deltas[i].cols);
                    for (let j = 0; j < deltas[i].cols; j++) {
                        let sum = 0;
                        for (let k = 0; k < deltas[i].rows; k++) {
                            sum += deltas[i].data[k][j];
                        }
                        dB.data[0][j] = (sum / m) * this.learningRate;
                    }
                    this.biases[i] = this.biases[i].subtract(dB);
                }
            }

            predict(input) {
                return this.forward(input);
            }

            getArchitecture() {
                return [2, ...this.layers];
            }
        }

        // ==================== Dataset Generation ====================

        function generateDataset(type, numPoints = 300) {
            const data = [];
            const labels = [];

            if (type === 'xor') {
                const corners = [[0, 0], [0, 1], [1, 0], [1, 1]];
                const expectedLabels = [0, 1, 1, 0];
                for (let i = 0; i < numPoints; i++) {
                    const corner = corners[i % 4];
                    const noise = 0.1;
                    data.push([
                        corner[0] + (Math.random() - 0.5) * noise,
                        corner[1] + (Math.random() - 0.5) * noise
                    ]);
                    labels.push(expectedLabels[i % 4]);
                }
            } else if (type === 'circle') {
                for (let i = 0; i < numPoints; i++) {
                    const angle = Math.random() * 2 * Math.PI;
                    const radius = Math.random();
                    const x = 0.5 + radius * 0.4 * Math.cos(angle);
                    const y = 0.5 + radius * 0.4 * Math.sin(angle);
                    data.push([x, y]);
                    labels.push(radius < 0.5 ? 0 : 1);
                }
            } else if (type === 'spiral') {
                for (let i = 0; i < numPoints; i++) {
                    const label = i < numPoints / 2 ? 0 : 1;
                    const angle = (i / numPoints) * 4 * Math.PI;
                    const radius = (i / numPoints) * 0.4;
                    const noise = (Math.random() - 0.5) * 0.05;
                    const x = 0.5 + (radius + noise) * Math.cos(angle);
                    const y = 0.5 + (radius + noise) * Math.sin(angle);
                    data.push([x, y]);
                    labels.push(label);
                }
            } else if (type === 'gaussian') {
                for (let i = 0; i < numPoints; i++) {
                    const label = i < numPoints / 2 ? 0 : 1;
                    const centerX = label === 0 ? 0.3 : 0.7;
                    const centerY = label === 0 ? 0.3 : 0.7;
                    const x = centerX + (Math.random() - 0.5) * 0.3;
                    const y = centerY + (Math.random() - 0.5) * 0.3;
                    data.push([x, y]);
                    labels.push(label);
                }
            } else if (type === 'moons') {
                for (let i = 0; i < numPoints; i++) {
                    const label = i < numPoints / 2 ? 0 : 1;
                    const angle = Math.random() * Math.PI;
                    if (label === 0) {
                        const x = 0.2 + 0.3 * Math.cos(angle);
                        const y = 0.3 + 0.15 * Math.sin(angle);
                        data.push([x + (Math.random() - 0.5) * 0.1, y + (Math.random() - 0.5) * 0.1]);
                    } else {
                        const x = 0.7 - 0.3 * Math.cos(angle);
                        const y = 0.7 - 0.15 * Math.sin(angle);
                        data.push([x + (Math.random() - 0.5) * 0.1, y + (Math.random() - 0.5) * 0.1]);
                    }
                    labels.push(label);
                }
            } else if (type === 'sine') {
                for (let i = 0; i < numPoints; i++) {
                    const x = Math.random();
                    const y = 0.5 + 0.2 * Math.sin(x * 4 * Math.PI);
                    const label = Math.random() < 0.5 ? 0 : 1;
                    data.push([x, y + (Math.random() - 0.5) * 0.15]);
                    labels.push(label);
                }
            }

            return { data, labels };
        }

        // ==================== Visualization ====================

        let lossChart = null;

        function initializeLossChart() {
            const ctx = document.getElementById('lossChart').getContext('2d');
            if (lossChart) lossChart.destroy();
            lossChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Training Loss',
                        data: [],
                        borderColor: '#64ffda',
                        backgroundColor: 'rgba(100, 255, 218, 0.05)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 0,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: false },
                        filler: { propagate: true }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 2,
                            grid: { color: 'rgba(100, 255, 218, 0.1)' },
                            ticks: { color: '#a0a0a0' }
                        },
                        x: {
                            grid: { color: 'rgba(100, 255, 218, 0.1)' },
                            ticks: { color: '#a0a0a0' }
                        }
                    }
                }
            });
        }

        function drawDecisionBoundary(network, data, labels) {
            const canvas = document.getElementById('decisionBoundary');
            const ctx = canvas.getContext('2d');
            const width = canvas.offsetWidth;
            const height = canvas.offsetHeight;

            canvas.width = width;
            canvas.height = height;

            const resolution = 4;
            const imageData = ctx.createImageData(width, height);

            for (let y = 0; y < height; y += resolution) {
                for (let x = 0; x < width; x += resolution) {
                    const input = new Matrix(1, 2);
                    input.data[0][0] = x / width;
                    input.data[0][1] = y / height;

                    const output = network.predict(input);
                    const prediction = output.data[0][0] > output.data[0][1] ? 0 : 1;

                    const baseX = Math.floor(x);
                    const baseY = Math.floor(y);

                    for (let dy = 0; dy < resolution && baseY + dy < height; dy++) {
                        for (let dx = 0; dx < resolution && baseX + dx < width; dx++) {
                            const idx = ((baseY + dy) * width + (baseX + dx)) * 4;
                            if (prediction === 0) {
                                imageData.data[idx] = 255;
                                imageData.data[idx + 1] = 107;
                                imageData.data[idx + 2] = 107;
                                imageData.data[idx + 3] = 100;
                            } else {
                                imageData.data[idx] = 100;
                                imageData.data[idx + 1] = 255;
                                imageData.data[idx + 2] = 218;
                                imageData.data[idx + 3] = 100;
                            }
                        }
                    }
                }
            }

            ctx.putImageData(imageData, 0, 0);

            // Draw data points
            for (let i = 0; i < data.length; i++) {
                const x = data[i][0] * width;
                const y = data[i][1] * height;

                ctx.fillStyle = labels[i] === 0 ? '#ff6b6b' : '#64ffda';
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, 2 * Math.PI);
                ctx.fill();

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        function drawNetworkDiagram(network) {
            const canvas = document.getElementById('networkDiagram');
            const ctx = canvas.getContext('2d');
            const width = canvas.offsetWidth;
            const height = canvas.offsetHeight;

            canvas.width = width;
            canvas.height = height;

            ctx.fillStyle = 'rgba(10, 25, 47, 0.5)';
            ctx.fillRect(0, 0, width, height);

            const architecture = network.getArchitecture();
            const layerCount = architecture.length;
            const padding = 40;
            const usableWidth = width - 2 * padding;
            const layerWidth = usableWidth / (layerCount - 1);

            const nodePositions = [];

            for (let layer = 0; layer < layerCount; layer++) {
                const numNeurons = architecture[layer];
                const positions = [];
                const layerHeight = Math.min(height - 2 * padding, numNeurons * 40);
                const neuronSpacing = numNeurons > 1 ? layerHeight / (numNeurons - 1) : 0;

                for (let i = 0; i < numNeurons; i++) {
                    const x = padding + layer * layerWidth;
                    const y = padding + (height - 2 * padding) / 2 - layerHeight / 2 + i * neuronSpacing;
                    positions.push({ x, y });
                }

                nodePositions.push(positions);
            }

            // Draw connections
            for (let layer = 0; layer < layerCount - 1; layer++) {
                const weight = network.weights[layer];
                const maxWeight = Math.max(...weight.data.flat().map(Math.abs));

                for (let i = 0; i < nodePositions[layer].length; i++) {
                    for (let j = 0; j < nodePositions[layer + 1].length; j++) {
                        const from = nodePositions[layer][i];
                        const to = nodePositions[layer + 1][j];

                        const w = weight.data[i][j];
                        const intensity = Math.abs(w) / maxWeight;
                        const color = w > 0 ? `rgba(100, 255, 218, ${intensity * 0.4})` : `rgba(255, 107, 107, ${intensity * 0.4})`;

                        ctx.strokeStyle = color;
                        ctx.lineWidth = 1 + intensity * 3;
                        ctx.beginPath();
                        ctx.moveTo(from.x, from.y);
                        ctx.lineTo(to.x, to.y);
                        ctx.stroke();
                    }
                }
            }

            // Draw nodes
            for (let layer = 0; layer < layerCount; layer++) {
                const isInput = layer === 0;
                const isOutput = layer === layerCount - 1;

                for (let i = 0; i < nodePositions[layer].length; i++) {
                    const { x, y } = nodePositions[layer][i];

                    if (isInput || isOutput) {
                        ctx.fillStyle = '#64ffda';
                    } else {
                        ctx.fillStyle = '#64ffda';
                    }

                    ctx.beginPath();
                    ctx.arc(x, y, 6, 0, 2 * Math.PI);
                    ctx.fill();

                    ctx.strokeStyle = '#64ffda';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }
        }

        // ==================== Main App Logic ====================

        let network = null;
        let trainingData = { data: [], labels: [] };
        let isTraining = false;
        let currentEpoch = 0;
        let trainingStartTime = 0;
        let lossHistory = [];
        let accuracyHistory = [];
        let batchY = null;

        const config = {
            hiddenLayers: [
                { neurons: 8, activation: 'relu' },
                { neurons: 8, activation: 'relu' }
            ],
            dataset: 'spiral',
            learningRate: 0.1,
            batchSize: 32,
            epochs: 100,
            regularization: 0,
            regType: 'none'
        };

        function initializeNetwork() {
            network = new NeuralNetwork(2, config.hiddenLayers);
            network.learningRate = config.learningRate;
            network.regularization = config.regularization;
            network.regType = config.regType;
            currentEpoch = 0;
            lossHistory = [];
            accuracyHistory = [];
            updateNetworkDiagram();
        }

        function updateNetworkDiagram() {
            requestAnimationFrame(() => drawNetworkDiagram(network));
        }

        function updateMetrics(loss, accuracy) {
            document.getElementById('lossValue').textContent = loss.toFixed(4);
            document.getElementById('accuracyValue').textContent = (accuracy * 100).toFixed(2) + '%';
            document.getElementById('epochValue').textContent = currentEpoch;

            const elapsed = Math.floor((Date.now() - trainingStartTime) / 1000);
            document.getElementById('timeValue').textContent = elapsed + 's';

            lossHistory.push(loss);
            accuracyHistory.push(accuracy);

            if (lossChart) {
                lossChart.data.labels.push(currentEpoch);
                lossChart.data.datasets[0].data.push(loss);
                if (lossChart.data.labels.length > 100) {
                    lossChart.data.labels.shift();
                    lossChart.data.datasets[0].data.shift();
                }
                lossChart.options.scales.y.max = Math.max(2, Math.max(...lossChart.data.datasets[0].data) * 1.1);
                lossChart.update('none');
            }
        }

        function calculateLoss(predictions, actual) {
            let loss = 0;
            for (let i = 0; i < predictions.rows; i++) {
                const pred = predictions.data[i];
                const label = actual.data[i];
                loss += -(label[0] * Math.log(Math.max(pred[0], 1e-10)) +
                         label[1] * Math.log(Math.max(pred[1], 1e-10)));
            }
            return loss / predictions.rows;
        }

        function calculateAccuracy(predictions, labels) {
            let correct = 0;
            for (let i = 0; i < predictions.rows; i++) {
                const pred = predictions.data[i][0] > predictions.data[i][1] ? 0 : 1;
                correct += pred === labels[i] ? 1 : 0;
            }
            return correct / predictions.rows;
        }

        function trainBatch() {
            if (!isTraining || currentEpoch >= config.epochs) {
                isTraining = false;
                document.getElementById('statusIndicator').className = 'status-indicator idle';
                document.getElementById('statusText').textContent = 'Training Complete';
                return;
            }

            const batchSize = Math.min(config.batchSize, trainingData.data.length);
            const batchIndices = [];
            for (let i = 0; i < batchSize; i++) {
                batchIndices.push(Math.floor(Math.random() * trainingData.data.length));
            }

            const batchInput = new Matrix(batchSize, 2);
            batchY = new Matrix(batchSize, 2);

            for (let i = 0; i < batchSize; i++) {
                const idx = batchIndices[i];
                batchInput.data[i] = trainingData.data[idx];
                batchY.data[i] = trainingData.labels[idx] === 0 ? [1, 0] : [0, 1];
            }

            const output = network.forward(batchInput);
            network.backward(batchInput, output, batchY);

            const fullOutput = network.predict(
                new Matrix(1, 2).apply(() =>
                    new Matrix(trainingData.data.length, 2).apply((i, j) => {
                        const result = new Matrix(trainingData.data.length, 2);
                        for (let k = 0; k < trainingData.data.length; k++) {
                            result.data[k] = trainingData.data[k];
                        }
                        return result;
                    })
                )
            );

            const allInput = new Matrix(trainingData.data.length, 2);
            for (let i = 0; i < trainingData.data.length; i++) {
                allInput.data[i] = trainingData.data[i];
            }
            const predictions = network.predict(allInput);
            const loss = calculateLoss(predictions, new Matrix(trainingData.data.length, 2).apply((i, j) =>
                trainingData.labels[i] === 0 ? (j === 0 ? 1 : 0) : (j === 0 ? 0 : 1)
            ));
            const accuracy = calculateAccuracy(predictions, trainingData.labels);

            currentEpoch++;
            updateMetrics(loss, accuracy);
            drawDecisionBoundary(network, trainingData.data, trainingData.labels);

            requestAnimationFrame(trainBatch);
        }

        function train() {
            if (isTraining) return;
            isTraining = true;
            trainingStartTime = Date.now();
            document.getElementById('statusIndicator').className = 'status-indicator training';
            document.getElementById('statusText').textContent = 'Training...';
            document.getElementById('trainBtn').classList.add('active');
            trainBatch();
        }

        function pause() {
            isTraining = false;
            document.getElementById('statusIndicator').className = 'status-indicator idle';
            document.getElementById('statusText').textContent = 'Paused';
            document.getElementById('trainBtn').classList.remove('active');
        }

        function reset() {
            isTraining = false;
            currentEpoch = 0;
            lossHistory = [];
            accuracyHistory = [];

            initializeNetwork();
            initializeLossChart();
            drawDecisionBoundary(network, trainingData.data, trainingData.labels);

            document.getElementById('statusIndicator').className = 'status-indicator idle';
            document.getElementById('statusText').textContent = 'Ready';
            document.getElementById('trainBtn').classList.remove('active');
            document.getElementById('accuracyValue').textContent = '0.00%';
            document.getElementById('lossValue').textContent = '0.00';
            document.getElementById('epochValue').textContent = '0';
            document.getElementById('timeValue').textContent = '0s';
        }

        function updateHiddenLayers() {
            const container = document.getElementById('hiddenLayers');
            container.innerHTML = '';

            config.hiddenLayers.forEach((layer, idx) => {
                const layerDiv = document.createElement('div');
                layerDiv.className = 'layer-item';
                layerDiv.innerHTML = `
                    <div class="layer-header">Hidden Layer ${idx + 1}</div>
                    <div class="layer-controls-inner">
                        <input type="range" min="1" max="10" value="${layer.neurons}"
                               class="layer-neurons" style="flex: 1; margin-right: 10px;"
                               data-layer="${idx}">
                        <select class="activation" data-layer="${idx}">
                            <option value="relu" ${layer.activation === 'relu' ? 'selected' : ''}>ReLU</option>
                            <option value="sigmoid" ${layer.activation === 'sigmoid' ? 'selected' : ''}>Sigmoid</option>
                            <option value="tanh" ${layer.activation === 'tanh' ? 'selected' : ''}>Tanh</option>
                        </select>
                        <button class="remove-layer" data-layer="${idx}">✕</button>
                    </div>
                    <div class="neurons-display" data-neurons="${idx}">${layer.neurons} neurons</div>
                `;
                container.appendChild(layerDiv);
            });

            document.querySelectorAll('.layer-neurons').forEach(slider => {
                slider.addEventListener('input', (e) => {
                    const layer = parseInt(e.target.dataset.layer);
                    const value = parseInt(e.target.value);
                    config.hiddenLayers[layer].neurons = value;
                    document.querySelector(`[data-neurons="${layer}"]`).textContent = value + ' neurons';
                    if (!isTraining) reset();
                });
            });

            document.querySelectorAll('.activation').forEach(select => {
                select.addEventListener('change', (e) => {
                    const layer = parseInt(e.target.dataset.layer);
                    config.hiddenLayers[layer].activation = e.target.value;
                    if (!isTraining) reset();
                });
            });

            document.querySelectorAll('.remove-layer').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const layer = parseInt(e.target.dataset.layer);
                    if (config.hiddenLayers.length > 1) {
                        config.hiddenLayers.splice(layer, 1);
                        updateHiddenLayers();
                        if (!isTraining) reset();
                    }
                });
            });
        }

        // Event listeners
        document.getElementById('trainBtn').addEventListener('click', train);
        document.getElementById('pauseBtn').addEventListener('click', pause);
        document.getElementById('resetBtn').addEventListener('click', reset);

        document.getElementById('addLayerBtn').addEventListener('click', () => {
            if (config.hiddenLayers.length < 5) {
                config.hiddenLayers.push({ neurons: 8, activation: 'relu' });
                updateHiddenLayers();
                if (!isTraining) reset();
            }
        });

        document.getElementById('learningRate').addEventListener('input', (e) => {
            config.learningRate = parseFloat(e.target.value);
            document.getElementById('lrValue').textContent = config.learningRate.toFixed(3);
            if (network) network.learningRate = config.learningRate;
        });

        document.getElementById('batchSize').addEventListener('input', (e) => {
            config.batchSize = parseInt(e.target.value);
            document.getElementById('bsValue').textContent = config.batchSize;
        });

        document.getElementById('epochs').addEventListener('input', (e) => {
            config.epochs = parseInt(e.target.value);
            document.getElementById('epochsValue').textContent = config.epochs;
        });

        document.getElementById('regularization').addEventListener('input', (e) => {
            config.regularization = parseFloat(e.target.value);
            document.getElementById('regValue').textContent = config.regularization.toFixed(3);
            if (network) network.regularization = config.regularization;
        });

        document.getElementById('regType').addEventListener('change', (e) => {
            config.regType = e.target.value;
            if (network) network.regType = config.regType;
        });

        document.querySelectorAll('.dataset-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.dataset-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                config.dataset = e.target.dataset.dataset;
                trainingData = generateDataset(config.dataset);
                if (!isTraining) reset();
            });
        });

        // Initialize
        trainingData = generateDataset(config.dataset);
        initializeLossChart();
        initializeNetwork();
        updateHiddenLayers();
        drawDecisionBoundary(network, trainingData.data, trainingData.labels);

        // Handle window resize
        window.addEventListener('resize', () => {
            if (network) {
                drawDecisionBoundary(network, trainingData.data, trainingData.labels);
                updateNetworkDiagram();
            }
        });
    </script>
</body>
