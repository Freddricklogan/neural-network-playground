<!DOCTYPE html>
<html lang="en" data-theme="signal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Neural Network Playground — in-browser deep learning</title>
<meta name="description" content="Build, train and visualise a neural network on synthetic 2-D datasets. A from-scratch engine — matrices, backpropagation, softmax cross-entropy, L1/L2 regularisation — running entirely client-side with no ML framework.">
<meta name="theme-color" content="#0b1220">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1220'/%3E%3Cg fill='none' stroke='%2358A6FF' stroke-width='1.5'%3E%3Cline x1='8' y1='10' x2='16' y2='7'/%3E%3Cline x1='8' y1='10' x2='16' y2='16'/%3E%3Cline x1='8' y1='22' x2='16' y2='16'/%3E%3Cline x1='8' y1='22' x2='16' y2='25'/%3E%3Cline x1='16' y1='7' x2='24' y2='16'/%3E%3Cline x1='16' y1='16' x2='24' y2='16'/%3E%3Cline x1='16' y1='25' x2='24' y2='16'/%3E%3C/g%3E%3Cg fill='%2358A6FF'%3E%3Ccircle cx='8' cy='10' r='2.5'/%3E%3Ccircle cx='8' cy='22' r='2.5'/%3E%3Ccircle cx='16' cy='7' r='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5'/%3E%3Ccircle cx='16' cy='25' r='2.5'/%3E%3Ccircle cx='24' cy='16' r='2.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<link rel="stylesheet" href="src/exec-shell.css">
<link rel="stylesheet" href="src/app.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"
        integrity="sha384-Sse/HDqcypGpyTDpvZOJNnG0TT3feGQUkF9H+mnRvic+LjR+K1NhTt8f51KIQ3v3"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
        defer></script>
</head>
<body>
<main id="demo-root" class="exec-main">
  <div class="nnp-grid">

    <section class="panel" aria-labelledby="cfg-heading">
      <h2 id="cfg-heading">Configuration</h2>

      <div class="control-group">
        <span class="control-label" id="dataset-label">Dataset</span>
        <div class="dataset-buttons" role="group" aria-labelledby="dataset-label">
          <button type="button" class="dataset-btn" data-dataset="xor">XOR</button>
          <button type="button" class="dataset-btn" data-dataset="circle">Circle</button>
          <button type="button" class="dataset-btn is-active" data-dataset="spiral" aria-pressed="true">Spiral</button>
          <button type="button" class="dataset-btn" data-dataset="gaussian">Gaussian</button>
          <button type="button" class="dataset-btn" data-dataset="moons">Moons</button>
          <button type="button" class="dataset-btn" data-dataset="sine">Sine</button>
        </div>
      </div>

      <div class="control-group">
        <label for="learningRate">Learning Rate: <span id="lrValue" class="control-value">0.1</span></label>
        <input type="range" id="learningRate" min="0.001" max="1" step="0.001" value="0.1" aria-describedby="lrValue">
      </div>

      <div class="control-group">
        <label for="batchSize">Batch Size: <span id="bsValue" class="control-value">32</span></label>
        <input type="range" id="batchSize" min="1" max="128" step="1" value="32" aria-describedby="bsValue">
      </div>

      <div class="control-group">
        <label for="epochs">Epochs: <span id="epochsValue" class="control-value">100</span></label>
        <input type="range" id="epochs" min="1" max="500" step="1" value="100" aria-describedby="epochsValue">
      </div>

      <div class="control-group">
        <label for="regularization">Regularization: <span id="regValue" class="control-value">0</span></label>
        <input type="range" id="regularization" min="0" max="0.1" step="0.001" value="0" aria-describedby="regValue">
      </div>

      <div class="control-group">
        <label for="regType">Reg Type</label>
        <select id="regType">
          <option value="none">None</option>
          <option value="l1">L1</option>
          <option value="l2">L2</option>
        </select>
      </div>

      <div class="control-group">
        <label for="seed">Random Seed <span class="control-hint">(reproducible runs)</span></label>
        <input type="number" id="seed" class="seed-input" value="42" min="0" step="1">
      </div>

      <div class="button-group">
        <button type="button" id="trainBtn" class="btn btn--primary">Train</button>
        <button type="button" id="pauseBtn" class="btn">Pause</button>
        <button type="button" id="resetBtn" class="btn btn--danger">Reset</button>
      </div>

      <div class="button-group">
        <button type="button" id="exportBtn" class="btn">Export Model</button>
      </div>

      <div class="training-status">
        <span class="status-indicator is-idle" id="statusIndicator" aria-hidden="true"></span>
        <span class="status-text" id="statusText" role="status" aria-live="polite">Ready</span>
      </div>
    </section>

    <section class="center-panel" aria-labelledby="viz-heading">
      <h2 id="viz-heading" class="sr-only">Visualisations</h2>

      <div class="visualization-container">
        <h3>Decision Boundary</h3>
        <canvas id="decisionBoundary" width="520" height="420" role="img"
                aria-label="Decision boundary over the training points"></canvas>
      </div>

      <div class="visualization-container">
        <h3>Training Progress</h3>
        <canvas id="lossChart" width="520" height="220" role="img"
                aria-label="Loss and accuracy per epoch"></canvas>
        <p id="chartFallback" class="chart-fallback" hidden>
          Chart library unavailable — metrics are still shown below.
        </p>
      </div>

      <div class="metrics-grid">
        <div class="metric">
          <div class="metric-value" id="accuracyValue" aria-live="polite">0.00%</div>
          <div class="metric-label">Accuracy</div>
        </div>
        <div class="metric">
          <div class="metric-value" id="lossValue" aria-live="polite">0.00</div>
          <div class="metric-label">Loss</div>
        </div>
        <div class="metric">
          <div class="metric-value" id="epochValue" aria-live="polite">0</div>
          <div class="metric-label">Epoch</div>
        </div>
        <div class="metric">
          <div class="metric-value" id="timeValue" aria-live="polite">0s</div>
          <div class="metric-label">Time</div>
        </div>
      </div>
    </section>

    <section class="right-panel" aria-labelledby="arch-heading">
      <div class="panel">
        <h2 id="arch-heading">Network Architecture</h2>
        <div class="layer-controls">
          <div class="layer-item">
            <div class="layer-header">Input Layer</div>
            <div class="neurons-display">2 neurons</div>
          </div>
          <div id="hiddenLayers"></div>
          <div class="layer-item">
            <div class="layer-header">Output Layer</div>
            <div class="neurons-display">2 neurons (softmax)</div>
          </div>
          <button type="button" class="add-layer-btn" id="addLayerBtn">+ Add Hidden Layer</button>
        </div>
      </div>

      <div class="panel panel--grow">
        <h2>Network Diagram</h2>
        <canvas id="networkDiagram" class="network-canvas" width="360" height="300" role="img"
                aria-label="Diagram of the current network architecture"></canvas>
      </div>
    </section>

  </div>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
